name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *" # nightly run catches regressions on the target sites
  workflow_dispatch:
    inputs:
      marker:
        description: "Pytest marker expression (e.g. smoke, api, 'ui and regression')"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Official image with browsers and system deps preinstalled: no apt-get on the
    # runner, so a flaky Ubuntu mirror can't break the run. Keep the tag in sync
    # with the playwright version pinned in requirements.txt.
    container:
      image: mcr.microsoft.com/playwright/python:v1.65.0-noble
    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1" # throwaway container, no venv needed
      PIP_ROOT_USER_ACTION: ignore
      PIP_NO_CACHE_DIR: "1"
    defaults:
      run:
        shell: bash # containers default to sh
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m pip install -r requirements.txt

      - name: Run tests (Chromium + Firefox, 4 workers)
        env:
          MARKER: ${{ github.event.inputs.marker }}
          HOME: /root # Firefox needs a writable home when the container runs as root
        run: |
          args=(--browser chromium --browser firefox -n 4 --tracing retain-on-failure --output test-results)
          if [ -n "$MARKER" ]; then args+=(-m "$MARKER"); fi
          pytest "${args[@]}"

      - name: Write Allure environment info
        if: always()
        run: |
          cp allure/categories.json allure-results/
          {
            echo "Python=$(python3 --version | cut -d' ' -f2)"
            echo "Playwright=$(python3 -m pip show playwright | awk '/^Version/ {print $2}')"
            echo "Browsers=Chromium, Firefox"
            echo "UI.Target=https://www.saucedemo.com"
            echo "API.Target=https://restful-booker.herokuapp.com"
            echo "Commit=${GITHUB_SHA::7}"
          } > allure-results/environment.properties
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat > allure-results/executor.json <<EOF
          {"name": "GitHub Actions", "type": "github", "buildOrder": $GITHUB_RUN_NUMBER,
           "buildName": "Run #$GITHUB_RUN_NUMBER ($GITHUB_EVENT_NAME)", "buildUrl": "$run_url",
           "reportUrl": "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"}
          EOF

      - name: Upload Playwright traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

  report:
    needs: test
    if: always() && github.ref == 'refs/heads/main' && needs.test.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: allure-results
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore trend history from the published report
        run: |
          mkdir -p allure-results/history
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history"
          for f in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
            curl -sfL "$base/$f" -o "allure-results/history/$f" || true
          done

      - name: Generate Allure report
        run: npx --yes allure-commandline@2.46.1 generate allure-results --clean -o allure-report

      - name: Upload Allure report
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7

      # Only a full-suite run replaces the public report; filtered manual runs
      # (e.g. marker=smoke) keep their report as an artifact only.
      - name: Package report for GitHub Pages
        if: ${{ !github.event.repository.private && !inputs.marker }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

  # Pages is only available on public repos with a free plan. On a private repo
  # the report is still built and kept as the `allure-report` artifact.
  deploy:
    needs: report
    if: ${{ always() && needs.report.result == 'success' && !github.event.repository.private && !inputs.marker }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

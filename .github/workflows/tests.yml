name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *" # nightly run catches regressions on the target sites
  workflow_dispatch:
    inputs:
      marker:
        description: "Pytest marker expression (e.g. smoke, api, 'ui and regression')"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium firefox

      - name: Run tests (Chromium + Firefox, 4 workers)
        env:
          MARKER: ${{ github.event.inputs.marker }}
        run: |
          args=(--browser chromium --browser firefox -n 4 --tracing retain-on-failure --output test-results)
          if [ -n "$MARKER" ]; then args+=(-m "$MARKER"); fi
          pytest "${args[@]}"

      - name: Write Allure environment info
        if: always()
        run: |
          cp allure/categories.json allure-results/
          {
            echo "Python=$(python --version | cut -d' ' -f2)"
            echo "Playwright=$(pip show playwright | awk '/^Version/ {print $2}')"
            echo "Browsers=Chromium, Firefox"
            echo "UI.Target=https://www.saucedemo.com"
            echo "API.Target=https://restful-booker.herokuapp.com"
            echo "Commit=${GITHUB_SHA::7}"
          } > allure-results/environment.properties

      - name: Upload Playwright traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

  report:
    needs: test
    if: always() && github.ref == 'refs/heads/main' && needs.test.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read # job-level permissions replace the workflow-level ones
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore trend history from the published report
        run: |
          mkdir -p allure-results/history
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history"
          for f in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
            curl -sfL "$base/$f" -o "allure-results/history/$f" || true
          done

      - name: Generate Allure report
        run: npx --yes allure-commandline@2.46.1 generate allure-results --clean -o allure-report

      - uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report
      - id: deploy
        uses: actions/deploy-pages@v4
